[project]
name = "crm"
version = "0.1.0"
description = "Пет-проект CRM системы"
authors = [
    {name = "Marina",email = "marina-a-zhukova@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.0.2,<7.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "dj-database-url (>=3.1.1,<4.0.0)",
    "asgi-prometheus (>=1.2.3,<2.0.0)",
    "prometheus-client (>=0.24.1,<0.25.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "django-debug-toolbar (>=6.2.0,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "django-prometheus (>=2.4.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "crm", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.4,<0.16.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "darglint (>=1.8.1,<2.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]
