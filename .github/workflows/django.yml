name: Django CI
permissions:
  actions: read 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4
    - name: Set up PostgreSQL
      uses: actions/setup-pg@v4
      with:
        postgres-version: '16'
        database: 'crm_db'
    - name: Set up Environment Variables for DB
      run: |
        echo "DATABASE_URL=postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@$PG_HOST:$PG_PORT/$PG_DATABASE" >> $GITHUB_ENV
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install Dependencies
      run: |
        python -m pip install "poetry-core>=1.0.0"
        poetry install --with dev --no-root
    - name: Проверка стиля кода (Ruff)
      run: |
        poetry run ruff check . --exit-zero --no-fix
    - name: Run Tests
      run: |
        poetry run python manage.py test
